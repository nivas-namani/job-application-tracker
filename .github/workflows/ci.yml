name: CI and deployment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trackify
          POSTGRES_USER: trackify
          POSTGRES_PASSWORD: trackify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackify -d trackify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://trackify:trackify@localhost:5432/trackify?schema=public
      JWT_SECRET: ci-only-secret-that-is-long-enough-to-be-valid
      CLIENT_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Apply schema migrations
        run: npx prisma migrate deploy --schema server/prisma/schema.prisma
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Render
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The secrets context is not available in a job-level `if`, so the hook is
      # checked here instead: a repository without the secret simply skips the call.
      - name: Trigger production deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        if: env.DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
