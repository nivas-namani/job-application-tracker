name: CI and deployment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trackify
          POSTGRES_USER: trackify
          POSTGRES_PASSWORD: trackify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackify -d trackify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://trackify:trackify@localhost:5432/trackify?schema=public
      JWT_SECRET: ci-only-secret-that-is-long-enough-to-be-valid
      CLIENT_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Apply schema migrations
        run: npx prisma migrate deploy --schema server/prisma/schema.prisma
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The secrets context cannot be read from a job-level `if`, and a step's own
    # `env` block is not set when its `if` is evaluated. Job-level env is set
    # before any step runs, so the provider checks below can read it. Each step
    # is skipped when its secret is absent, so one repository can target one
    # provider without the others failing.
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up flyctl
        if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only

      - name: Trigger Render deployment
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      # Railway needs nothing here: connect the repository in the Railway
      # dashboard and turn on "Wait for CI" so it deploys only after this
      # workflow passes.
