services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trackify
      POSTGRES_USER: trackify
      POSTGRES_PASSWORD: trackify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackify -d trackify"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
